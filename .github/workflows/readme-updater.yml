name: README Updater

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Update blog posts
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://medium.com/feed/@ivanliu1989"
          max_post_count: 5
          readme_path: "./README.md"
          blog_post_list_start_marker: "<!-- BLOG-POST-LIST:START -->"
          blog_post_list_end_marker: "<!-- BLOG-POST-LIST:END -->"
      - name: Update recent activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "docs: update README with recent activity"
          MAX_LINES: 10
          README_PATH: "./README.md"
          START_COMMENT: "<!--START_SECTION:activity-->"
          END_COMMENT: "<!--END_SECTION:activity-->"
